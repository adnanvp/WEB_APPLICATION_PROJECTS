

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Registration Form</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.svg" />
  <!---Custom CSS File--->
  <link rel="stylesheet" href="css/lawyer_reg.css" />
  <style>
    form button {
      height: 55px;
      width: 100%;
      color: #fff;
      font-size: 1rem;
      font-weight: 400;
      margin-top: 30px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #47A992;
    }
    form p input[type=text] {
      position: relative;
      height: 50px;
      width: 76%;
      outline: none;
      font-size: 1rem;
      color: #707070;
      margin-top: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0 15px;
    }

    form p input[type=email] {
      position: relative;
      height: 50px;
      width: 76%;
      outline: none;
      font-size: 1rem;
      color: #707070;
      margin-top: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0 15px;
    }

    form p input[type=date] {
      width: 23%;
      margin-left: 148px;
      margin-top: 17px;
      height: 37px;
      border-radius: 6px;
      border: 1px solid #ddd;
      color: #707070;
      padding: 0 15px;
    }

    form p input {
      width: 23%;
      margin-left: 106px;
      margin-top: 17px;
      height: 37px;
      border-radius: 6px;
      border: 1px solid #ddd;
      color: #707070;
      padding: 0 15px;
    }

    form p select {
      width: 76%;
      margin-left: 148px;
      margin-top: 0px;
      height: 50px;
      border-radius: 6px;
      border: 1px solid #ddd;
      color: #707070;
      padding: 0 15px;
    }

    form p textarea {
      border-radius: 6px;
      border: 1px solid #ddd;
      color: #707070;
      padding: 0 15px;
      width: 76%;
      margin-left: 148px;
      margin-top: 21px;
    }
  </style>
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"> -->

</head>

<body>
  <section class="container">
    <header>Registration Form</header>

    <form action="" method="POST">
      <p>
        <label for="name">Full Name</label>
        <input type="text" name="name" id="name" required />
      </p>
      <p>
        <label for="email">Email Address</label>
        <input type="email" name="email" id="email" required />
      </p>
      <p>
        <label for="phone">Phone Number</label>
        <input type="text" name="phone" id="phone" required />
      </p>
      <p>
        <label for="dob">Date of Birth</label>
        <input type="date" name="date" id="dob" required />
      </p>
      <p>
        <label for="gender">Gender</label>
        <select name="gender" id="gender" required>
          <option value="" disabled selected>Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </p>
      <p>
        <label for="address">Address</label>
        <textarea name="address" id="address" rows="4" placeholder="Enter your address here..." required></textarea>  
      </p>
      <p>
        <label for="lawyer-type">Lawyer Type</label>
        <select name="lawyer-type" id="lawyer-type" required>
          <option value="" disabled selected>Select Lawyer Type</option>
          <option value="criminal">Criminal Law</option>
          <option value="divorce">Divorce Law</option>
          <option value="family">Family Law</option>
          <option value="real-estate">Real Estate Law</option>
          <option value="finance">Finance Law</option>
        </select>
      </p>
      <p>
        <label for="experience">Years of Experience</label>
        <input type="number" name="experience" id="experience" min="0" required />
      </p>
      <div class="form-row">
  <p>
    <label for="case-won">Cases Won</label>
    <input type="number" name="case-won" id="case-won" min="0" required />
  </p>

  <p>
    <label for="case-loss">Cases Lost</label>
    <input type="number" name="case-loss" id="case-loss" min="0" required />
  </p>
</div>
      <button type="submit">Submit</button>
    </form>
  </section>

  <div id="popup" style="
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: white;
  padding: 24px 32px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
">
  <h3 style="margin-bottom:10px; color:#47A992;">Success</h3>
  <p>Your appointment was booked.<br>Our Customer Care will contact you soon.</p>
  <button onclick="closePopup()" style="
    margin-top:15px;
    padding:8px 16px;
    border:none;
    background:#47A992;
    color:white;
    border-radius:6px;
    cursor:pointer;
  ">OK</button>
</div>

<script>
  const form = document.querySelector("form");
  const popup = document.getElementById("popup");

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    popup.style.opacity = "1";
    popup.style.transform = "translate(-50%, -50%) scale(1)";
    popup.style.pointerEvents = "auto";

    form.reset();
  });

  function closePopup() {
    popup.style.opacity = "0";
    popup.style.transform = "translate(-50%, -50%) scale(0.8)";
    popup.style.pointerEvents = "none";
  }
</script>

</body>

</html>
